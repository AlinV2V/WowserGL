name: CI

on:
  push:
    branches: [main, feature/vanillagl-studio, feature/unity-live-authoring]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check apps/bridge/server.mjs
      - run: node --check tools/dev-studio.mjs
      - run: npm run typecheck
      - run: npm run build
