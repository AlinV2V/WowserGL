name: CI

on:
  push:
    branches: [main, feature/vanillagl-studio, feature/unity-live-authoring, feature/engine-editor-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:engine
